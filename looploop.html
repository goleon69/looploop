<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>looploop</title>
<style>
  :root {
    --bg: #16181d; --panel: #1f232a; --line: #2d323b; --text: #e6e8eb; --muted: #9aa1ab;
    --start: #3ccf7a; --end: #ff5a5a; --head: #ffd24a; --accent: #3d7bd9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  #info { color: var(--muted); }
  main { padding: 16px; max-width: 860px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button * { pointer-events: none; }   /* il clic arriva sempre al bottone, anche sopra la scritta */
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; }
  .group > .name { color: var(--muted); min-width: 64px; }
  .group label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .pair { display: inline-flex; align-items: center; gap: 8px; }
  input[type=text] { width: 96px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 6px; font: 14px ui-monospace, Menlo, monospace; }
  input[type=range] { accent-color: var(--accent); }
  #pos { width: 100%; margin: 0; }
  #speed, #volume { width: 240px; max-width: 100%; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  #time { font-size: 16px; }
  #semisLabel { min-width: 112px; text-align: center; }
  #speedLabel, #volumeLabel { min-width: 48px; text-align: right; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #status { color: var(--muted); min-height: 20px; }
  #status.err { color: var(--end); }
  body.dragover main { outline: 2px dashed var(--accent); outline-offset: -6px; }
  button, select, input { touch-action: manipulation; }   /* niente zoom con doppio tocco */
  @media (max-width: 640px) {
    header { gap: 8px 10px; padding: 10px 12px; }
    #info { flex-basis: 100%; font-size: 13px; }
    main { padding: 12px; }
    .row > .group { flex: 1 1 100%; }
    button { padding: 11px 14px; min-height: 44px; }
    input[type=text] { padding: 9px 6px; font-size: 16px; width: 124px; }
    .pair { flex: 1 1 100%; }
    .pair label { min-width: 44px; }   /* 16 px: l'iPhone non ingrandisce la pagina */
    input[type=checkbox] { width: 22px; height: 22px; }
    #speed, #volume { flex: 1 1 0; width: 0; min-width: 0; }
    #pos { height: 36px; }
  }
</style>
</head>
<body>
<header>
  <h1>looploop <span style="font-size:12px;color:var(--muted);font-weight:normal">v0.3</span></h1>
  <button id="openBtn">Apri brano…</button>
  <input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.flac" hidden>
  <span id="info"></span>
</header>
<main>
  <div class="row">
    <button id="playBtn" class="primary" disabled>Play</button>
    <button id="toLoopBtn" disabled>Inizio loop</button>
    <span id="time" class="mono">00:00.000 / 00:00.000</span>
  </div>
  <input id="pos" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="Posizione nel brano">

  <div class="row">
    <div class="group">
      <span class="name">Loop</span>
      <label><input id="loopOn" type="checkbox" checked disabled> attivo</label>
      <span class="pair"><span class="dot" style="background:var(--start)"></span><label for="loopStart">Inizio</label>
        <input id="loopStart" type="text" inputmode="decimal" disabled>
        <button id="setStartBtn" disabled>Qui</button></span>
      <span class="pair"><span class="dot" style="background:var(--end)"></span><label for="loopEnd">Fine</label>
        <input id="loopEnd" type="text" inputmode="decimal" disabled>
        <button id="setEndBtn" disabled>Qui</button></span>
    </div>
  </div>

  <div class="row">
    <div class="group">
      <span class="name">Tono</span>
      <button id="semisDown" disabled aria-label="Un semitono giù">−</button>
      <span id="semisLabel" class="mono">0 semitoni</span>
      <button id="semisUp" disabled aria-label="Un semitono su">+</button>
      <button id="semisReset" disabled>Originale</button>
    </div>
  </div>

  <div class="row">
    <div class="group">
      <span class="name">Velocità</span>
      <input id="speed" type="range" min="50" max="100" step="5" value="100" disabled aria-label="Velocità">
      <span id="speedLabel" class="mono">100%</span>
      <button id="speedReset" disabled>100%</button>
    </div>
  </div>

  <div class="row">
    <div class="group">
      <span class="name">Volume</span>
      <input id="volume" type="range" min="0" max="100" step="1" value="100" disabled aria-label="Volume">
      <span id="volumeLabel" class="mono">100%</span>
    </div>
  </div>

  <div id="status">Apri un brano, oppure trascinalo qui.</div>
</main>

class FifoSampleBuffer {

    this._vector = new Float32Array();
    this._position = 0;
    this._frameCount = 0;

    return this._frameCount;

    this._position += numFrames;

    const numSamples = numFrames * 2;
    const sourceOffset = this.startIndex;
    output.set(this._vector.subarray(sourceOffset, sourceOffset + numSamples));
    this.receive(numFrames);
  }
  extract(output, position = 0, numFrames = 0) {
    const sourceOffset = this.startIndex + position * 2;
    const numSamples = numFrames * 2;
    output.set(this._vector.subarray(sourceOffset, sourceOffset + numSamples));
  }
  ensureCapacity(numFrames = 0) {
    const minLength = parseInt(numFrames * 2);
    if (this._vector.length < minLength) {
      const newVector = new Float32Array(minLength);
      newVector.set(this._vector.subarray(this.startIndex, this.endIndex));
      this._vector = newVector;
      this._position = 0;
    } else {

    }
  }
  ensureAdditionalCapacity(numFrames = 0) {
    this.ensureCapacity(this._frameCount + numFrames);
  }

    if (this._position > 0) {
      this._vector.set(this._vector.subarray(this.startIndex, this.endIndex));
      this._position = 0;
    }
  }
}

class AbstractFifoSamplePipe {
  constructor(createBuffers) {
    if (createBuffers) {

    }

  get inputBuffer() {
    return this._inputBuffer;
  }
  set inputBuffer(inputBuffer) {
    this._inputBuffer = inputBuffer;
  }
  get outputBuffer() {
    return this._outputBuffer;
  }
  set outputBuffer(outputBuffer) {
    this._outputBuffer = outputBuffer;
  }
  clear() {
    this._inputBuffer.clear();
    this._outputBuffer.clear();
  }

class RateTransposer extends AbstractFifoSamplePipe {

    this._inputBuffer.receive();
    this._outputBuffer.put(numFramesOutput);

  transpose(numFrames = 0) {
    if (numFrames === 0) {

    }

        dest[destOffset + 2 * i + 1] = (1.0 - this.slopeCount) * src[srcIndex + 1] + this.slopeCount * src[srcIndex + 3];
        i = i + 1;

class FilterSupport {
  constructor(pipe) {
    this._pipe = pipe;
  }
  get pipe() {
    return this._pipe;
  }
  get inputBuffer() {
    return this._pipe.inputBuffer;

  get outputBuffer() {
    return this._pipe.outputBuffer;

  fillInputBuffer() {

  fillOutputBuffer(numFrames = 0) {
    while (this.outputBuffer.frameCount < numFrames) {

      this.fillInputBuffer(numInputFrames);
      if (this.inputBuffer.frameCount < 8192 * 2) {
        break;
      }
      this._pipe.process();
    }
  }
  clear() {
    this._pipe.clear();
  }
}

const noop = function () {
  return;
};

    this.outputBufferPosition = 0;

    inputPosition += this._inputBuffer.startIndex;
    const output = this._outputBuffer.vector;
    const outputPosition = this._outputBuffer.endIndex;
    let i = 0;
    let context;
    let tempFrame;
    const frameScale = 1 / this.overlapLength;
    let fi;
    let inputOffset;
    let outputOffset;
    for (; i < this.overlapLength; i = i + 1) {
      tempFrame = (this.overlapLength - i) * frameScale;
      fi = i * frameScale;
      context = 2 * i;
      inputOffset = context + inputPosition;
      outputOffset = context + outputPosition;
      output[outputOffset + 0] = input[inputOffset + 0] * fi + this.midBuffer[context + 0] * tempFrame;
      output[outputOffset + 1] = input[inputOffset + 1] * fi + this.midBuffer[context + 1] * tempFrame;
    }
  }
  process() {
    let offset;
    let temp;
    let overlapSkip;
    if (this.midBuffer === null) {
      if (this._inputBuffer.frameCount < this.overlapLength) {
        return;
      }
      this.midBuffer = new Float32Array(this.overlapLength * 2);
      this._inputBuffer.receiveSamples(this.midBuffer, this.overlapLength);
    }
    while (this._inputBuffer.frameCount >= this.sampleReq) {
      offset = this.seekBestOverlapPosition();
      this._outputBuffer.ensureAdditionalCapacity(this.overlapLength);
      this.overlap(Math.floor(offset));
      this._outputBuffer.put(this.overlapLength);
      temp = this.seekWindowLength - 2 * this.overlapLength;
      if (temp > 0) {
        this._outputBuffer.putBuffer(this._inputBuffer, offset + this.overlapLength, temp);
      }
      const start = this._inputBuffer.startIndex + 2 * (offset + this.seekWindowLength - this.overlapLength);
      this.midBuffer.set(this._inputBuffer.vector.subarray(start, start + 2 * this.overlapLength));
      this.skipFract += this.nominalSkip;
      overlapSkip = Math.floor(this.skipFract);
      this.skipFract -= overlapSkip;
      this._inputBuffer.receive(overlapSkip);
    }
  }
}

const testFloatEqual = function (a, b) {
  return (a > b ? a - b : b - a) > 1e-10;
};

class SoundTouch {
  constructor() {
    this.transposer = new RateTransposer(false);
    this.stretch = new Stretch(false);
    this._inputBuffer = new FifoSampleBuffer();
    this._intermediateBuffer = new FifoSampleBuffer();
    this._outputBuffer = new FifoSampleBuffer();
    this._rate = 0;
    this._tempo = 0;
    this.virtualPitch = 1.0;
    this.virtualRate = 1.0;
    this.virtualTempo = 1.0;
    this.calculateEffectiveRateAndTempo();
  }
  clear() {
    this.transposer.clear();
    this.stretch.clear();
  }
  clone() {
    const result = new SoundTouch();
    result.rate = this.rate;
    result.tempo = this.tempo;
    return result;
  }
  get rate() {
    return this._rate;
  }
  set rate(rate) {
    this.virtualRate = rate;
    this.calculateEffectiveRateAndTempo();
  }
  set rateChange(rateChange) {
    this._rate = 1.0 + 0.01 * rateChange;
  }
  get tempo() {
    return this._tempo;
  }
  set tempo(tempo) {
    this.virtualTempo = tempo;
    this.calculateEffectiveRateAndTempo();
  }
  set tempoChange(tempoChange) {
    this.tempo = 1.0 + 0.01 * tempoChange;
  }
  set pitch(pitch) {
    this.virtualPitch = pitch;
    this.calculateEffectiveRateAndTempo();
  }
  set pitchOctaves(pitchOctaves) {
    this.pitch = Math.exp(0.69314718056 * pitchOctaves);
    this.calculateEffectiveRateAndTempo();
  }
  set pitchSemitones(pitchSemitones) {
    this.pitchOctaves = pitchSemitones / 12.0;
  }
  get inputBuffer() {
    return this._inputBuffer;
  }
  get outputBuffer() {
    return this._outputBuffer;
  }
  calculateEffectiveRateAndTempo() {
    const previousTempo = this._tempo;
    const previousRate = this._rate;
    this._tempo = this.virtualTempo / this.virtualPitch;
    this._rate = this.virtualRate * this.virtualPitch;
    if (testFloatEqual(this._tempo, previousTempo)) {
      this.stretch.tempo = this._tempo;
    }
    if (testFloatEqual(this._rate, previousRate)) {
      this.transposer.rate = this._rate;
    }
    if (this._rate > 1.0) {
      if (this._outputBuffer != this.transposer.outputBuffer) {
        this.stretch.inputBuffer = this._inputBuffer;
        this.stretch.outputBuffer = this._intermediateBuffer;
        this.transposer.inputBuffer = this._intermediateBuffer;
        this.transposer.outputBuffer = this._outputBuffer;
      }
    } else {
      if (this._outputBuffer != this.stretch.outputBuffer) {
        this.transposer.inputBuffer = this._inputBuffer;
        this.transposer.outputBuffer = this._intermediateBuffer;
        this.stretch.inputBuffer = this._intermediateBuffer;
        this.stretch.outputBuffer = this._outputBuffer;
      }
    }
  }
  process() {
    if (this._rate > 1.0) {
      this.stretch.process();
      this.transposer.process();
    } else {
      this.transposer.process();
      this.stretch.process();
    }
  }
}


/* ===== looploop: motore =====
 * Legge il brano decodificato, gestisce il loop e passa i campioni a SoundTouch.
 * Gira dentro l'AudioWorklet; se il browser non lo permette, la stessa classe gira nella pagina.
 * Posizioni e lunghezze qui dentro sono in campioni (frame), non in secondi.
 */
const LL_CHUNK = 1024;
class LoopEngine {
  constructor(sr, post) {
    this.sr = sr; this.post = post;
    this.L = null; this.R = null; this.len = 0;
    this.pos = 0;                 // prossimo campione da leggere dal brano
    this.playing = false;
    this.loopOn = true; this.ls = 0; this.le = 0; this.wrapped = false;
    this.fade = Math.round(sr * 0.003);   // 3 ms di sfumatura alla giunzione del loop, contro il clic
    this.tail = 0;
    this.st = new SoundTouch();
    this.st.stretch.setParameters(sr, 0, 0, 8);
    this.chunk = new Float32Array(LL_CHUNK * 2);
    this.out = new Float32Array(0);
    this.sinceReport = 0;
  }
  loopActive() { return this.loopOn && this.le - this.ls >= this.fade * 4; }
  resetSt() {
    const st = this.st;
    st.clear();
    st.stretch.midBuffer = null; st.stretch.skipFract = 0;
    st.transposer.reset();
  }
  // Posizione che si sta sentendo: quella di lettura meno ciò che è ancora in coda dentro SoundTouch
  shown() {
    const st = this.st;
    const mid = st._intermediateBuffer.frameCount;
    let lat = st._inputBuffer.frameCount + st._outputBuffer.frameCount * st._tempo * st._rate;
    lat += st._rate > 1 ? mid * st._tempo : mid * st._rate;
    let p = this.pos - lat;
    if (this.loopActive() && this.wrapped) { const n = this.le - this.ls; while (p < this.ls) p += n; }
    return Math.min(this.len, Math.max(0, p));
  }
  report() { this.sinceReport = 0; this.post({ type: "pos", pos: this.shown(), playing: this.playing }); }
  msg(d) {
    switch (d.type) {
      case "load":
        this.L = d.L; this.R = d.R || d.L; this.len = d.L.length;
        this.pos = 0; this.playing = false; this.ls = 0; this.le = this.len; this.wrapped = false; this.tail = 0;
        this.resetSt();
        break;
      case "play":
        if (!this.L) break;
        if (this.pos >= this.len) { this.pos = this.loopActive() ? this.ls : 0; this.resetSt(); }
        this.tail = 0; this.playing = true;
        break;
      case "pause": this.playing = false; break;
      case "seek":
        this.resetSt();
        this.pos = Math.min(this.len, Math.max(0, Math.round(d.pos)));
        this.wrapped = false; this.tail = 0;
        break;
      case "loop":
        this.loopOn = !!d.on; this.ls = Math.max(0, Math.round(d.ls)); this.le = Math.min(this.len, Math.round(d.le));
        this.wrapped = false;
        break;
      case "semis": {
        const p = this.shown();        // si riparte da dove si stava ascoltando, senza salti
        this.resetSt();
        this.st.pitchSemitones = d.value;
        this.pos = Math.round(p); this.wrapped = false;
        break;
      }
      case "speed": this.st.tempo = d.value; break;
    }
    this.report();
  }
  // Mette in this.chunk il prossimo pezzo di brano; restituisce quanti frame, 0 a fine brano
  feed() {
    const loop = this.loopActive();
    if (loop && this.pos >= this.le) { this.pos = this.ls; this.wrapped = true; }
    const end = loop ? this.le : this.len;
    if (this.pos >= end) return 0;
    const p = this.pos, n = Math.min(LL_CHUNK, end - p);
    const L = this.L, R = this.R, c = this.chunk;
    for (let i = 0; i < n; i++) { c[2 * i] = L[p + i]; c[2 * i + 1] = R[p + i]; }
    if (loop) {
      const f = this.fade, ls = this.ls, le = this.le;
      if (p + n > le - f) {
        for (let i = Math.max(0, le - f - p); i < n; i++) { const g = (le - (p + i)) / f; c[2 * i] *= g; c[2 * i + 1] *= g; }
      }
      if (this.wrapped && p < ls + f && p >= ls) {
        for (let i = 0; i < n && p + i < ls + f; i++) { const g = (p + i - ls) / f; c[2 * i] *= g; c[2 * i + 1] *= g; }
      }
    }
    this.pos = p + n;
    return n;
  }
  render(outL, outR) {
    const n = outL.length;
    if (!this.playing || !this.L) { outL.fill(0); if (outR !== outL) outR.fill(0); return; }
    const st = this.st, ob = st.outputBuffer;
    let guard = 0, finished = false;
    while (ob.frameCount < n && guard++ < 200) {
      let k = this.feed();
      if (k === 0) {                    // fine brano: un po' di silenzio per far uscire la coda
        if (this.tail >= this.sr * 0.4) { finished = true; break; }
        this.chunk.fill(0); k = LL_CHUNK; this.tail += k;
      }
      st.inputBuffer.putSamples(this.chunk, 0, k);
      st.process();
    }
    const got = Math.min(n, ob.frameCount);
    if (this.out.length < n * 2) this.out = new Float32Array(n * 2);
    const o = this.out;
    if (got > 0) ob.receiveSamples(o, got);
    for (let i = 0; i < got; i++) { outL[i] = o[2 * i]; outR[i] = o[2 * i + 1]; }
    for (let i = got; i < n; i++) { outL[i] = 0; outR[i] = 0; }
    if (finished) { this.playing = false; this.pos = this.len; this.resetSt(); this.report(); return; }
    this.sinceReport += n;
    if (this.sinceReport >= this.sr * 0.03) this.report();
  }
}
if (typeof registerProcessor === "function") {
  registerProcessor("looploop", class extends AudioWorkletProcessor {
    constructor() {
      super();
      this.eng = new LoopEngine(sampleRate, m => this.port.postMessage(m));
      this.port.onmessage = e => this.eng.msg(e.data);
    }
    process(inputs, outputs) {
      const o = outputs[0];
      if (o && o[0]) this.eng.render(o[0], o[1] || o[0]);
      return true;
    }
  });
}

</script>

<script>
"use strict";
const $ = id => document.getElementById(id);
const S = { ctx: null, node: null, mode: "", sr: 0, T: 0, pos: 0, playing: false,
            loopOn: true, ls: 0, le: 0, semis: 0, speed: 1, volume: 1, gain: null, name: "" };

function fmt(t) {
  t = Math.max(0, t);
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, "0") + ":" + s.toFixed(3).padStart(6, "0");
}
function parseTime(str) {
  str = str.trim().replace(",", ".");
  const p = str.split(":");
  let t = NaN;
  if (p.length === 1) t = parseFloat(p[0]);
  else if (p.length === 2) t = parseInt(p[0], 10) * 60 + parseFloat(p[1]);
  else if (p.length === 3) t = parseInt(p[0], 10) * 3600 + parseInt(p[1], 10) * 60 + parseFloat(p[2]);
  return isFinite(t) ? t : null;
}
function status(msg, err) { const el = $("status"); el.textContent = msg; el.classList.toggle("err", !!err); }
// Safari annulla il clic se la scritta di un bottone viene riscritta mentre lo si preme: si scrive solo se cambia
function setText(el, txt) { if (el.textContent !== txt) el.textContent = txt; }

/* ----- motore ----- */
// iPhone: senza questo l'audio della pagina resta muto se l'interruttore silenzioso è attivo
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (_) {}

let send = () => {};
function onEngineMsg(m) {
  if (m.type !== "pos") return;
  S.pos = m.pos / S.sr;
  S.playing = m.playing;
  updateUI();
}
async function ensureEngine() {
  if (S.node) return;
  const code = $("engine").textContent;
  S.sr = S.ctx.sampleRate;
  try {
    if (!S.ctx.audioWorklet || typeof AudioWorkletNode === "undefined") throw new Error("AudioWorklet non disponibile");
    // Pagina aperta da disco (file://): l'indirizzo blob viene rifiutato, quello data: no. Si provano entrambi.
    try {
      await S.ctx.audioWorklet.addModule("data:text/javascript;charset=utf-8," + encodeURIComponent(code));
    } catch (_) {
      await S.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
    }
    const node = new AudioWorkletNode(S.ctx, "looploop", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    node.port.onmessage = e => onEngineMsg(e.data);
    node.onprocessorerror = () => status("Errore nel motore audio (AudioWorklet).", true);
    send = (m, transfer) => node.port.postMessage(m, transfer || []);
    S.node = node; S.mode = "AudioWorklet";
  } catch (e) {
    // Ripiego: lo stesso motore dentro la pagina. Funziona, ma può scattare quando la pagina è occupata.
    console.warn("AudioWorklet non usato:", e);
    const Engine = new Function(code + "\nreturn LoopEngine;")();
    const eng = new Engine(S.sr, m => onEngineMsg(m));
    const node = S.ctx.createScriptProcessor(2048, 1, 2);
    node.onaudioprocess = ev => eng.render(ev.outputBuffer.getChannelData(0), ev.outputBuffer.getChannelData(1));
    send = m => eng.msg(m);
    S.node = node; S.mode = "ScriptProcessor (ripiego)";
  }
  S.gain = S.ctx.createGain();
  S.gain.gain.value = S.volume;
  S.node.connect(S.gain);
  S.gain.connect(S.ctx.destination);
}

/* ----- apertura del brano ----- */
async function loadFile(file) {
  if (!file) return;
  status("Carico " + file.name + "…");
  try {
    send({ type: "pause" });
    const bytes = await file.arrayBuffer();
    S.ctx = S.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const buf = await new Promise((res, rej) => S.ctx.decodeAudioData(bytes, res, rej));
    await ensureEngine();
    const L = buf.getChannelData(0).slice();
    const R = buf.numberOfChannels > 1 ? buf.getChannelData(1).slice() : null;
    S.T = buf.duration; S.name = file.name;
    S.pos = 0; S.playing = false; S.loopOn = true; S.ls = 0; S.le = S.T;
    send({ type: "load", L, R }, R ? [L.buffer, R.buffer] : [L.buffer]);
    send({ type: "semis", value: S.semis });
    send({ type: "speed", value: S.speed });
    sendLoop();
    $("pos").max = S.T.toFixed(2);
    $("info").textContent = `${file.name} · ${fmt(S.T)} · ${(S.sr / 1000).toFixed(1)} kHz · motore: ${S.mode}`;
    document.querySelectorAll("button, input").forEach(el => el.disabled = false);
    status("Spazio = Play/Pausa.");
    updateUI(true);
  } catch (e) {
    console.error(e);
    status("Non riesco ad aprire " + file.name + ": formato non riconosciuto dal browser.", true);
  }
}
$("openBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragover"); });
window.addEventListener("dragleave", () => document.body.classList.remove("dragover"));
window.addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("dragover"); loadFile(e.dataTransfer.files[0]); });

/* ----- riproduzione ----- */
function play() {
  if (!S.node) return;
  if (S.ctx.state !== "running") S.ctx.resume();      // chiamato dentro il clic: Safari lo permette
  send({ type: "play" });
}
function pause() { send({ type: "pause" }); }
function togglePlay() { if (S.playing) pause(); else play(); }
function seek(t) { send({ type: "seek", pos: Math.min(S.T, Math.max(0, t)) * S.sr }); }
$("playBtn").addEventListener("click", togglePlay);
$("toLoopBtn").addEventListener("click", () => seek(S.ls));

let posDrag = false;
const posEl = $("pos");
posEl.addEventListener("pointerdown", () => posDrag = true);
posEl.addEventListener("input", () => seek(parseFloat(posEl.value)));
["pointerup", "pointercancel", "change"].forEach(ev => posEl.addEventListener(ev, () => posDrag = false));

/* ----- loop ----- */
const MIN_LOOP = 0.05;
function sendLoop() { send({ type: "loop", on: S.loopOn, ls: S.ls * S.sr, le: S.le * S.sr }); }
function setLoop(ls, le) {
  ls = Math.min(S.T, Math.max(0, ls)); le = Math.min(S.T, Math.max(0, le));
  if (le - ls < MIN_LOOP) { status("La fine del loop deve venire dopo l'inizio.", true); updateUI(true); return; }
  S.ls = ls; S.le = le;
  status("Loop " + fmt(ls) + " – " + fmt(le) + " (" + (le - ls).toFixed(2) + " s)");
  sendLoop(); updateUI(true);
}
$("loopOn").addEventListener("change", e => { S.loopOn = e.target.checked; sendLoop(); });
$("setStartBtn").addEventListener("click", () => setLoop(S.pos, S.le > S.pos + MIN_LOOP ? S.le : S.T));
$("setEndBtn").addEventListener("click", () => setLoop(S.ls < S.pos - MIN_LOOP ? S.ls : 0, S.pos));
$("loopStart").addEventListener("change", e => { const t = parseTime(e.target.value); if (t === null) updateUI(true); else setLoop(t, S.le); });
$("loopEnd").addEventListener("change", e => { const t = parseTime(e.target.value); if (t === null) updateUI(true); else setLoop(S.ls, t); });

/* ----- tono e velocità ----- */
const MAX_SEMIS = 3;
function setSemis(v) {
  S.semis = Math.min(MAX_SEMIS, Math.max(-MAX_SEMIS, v));
  send({ type: "semis", value: S.semis });
  updateUI();
}
$("semisDown").addEventListener("click", () => setSemis(S.semis - 1));
$("semisUp").addEventListener("click", () => setSemis(S.semis + 1));
$("semisReset").addEventListener("click", () => setSemis(0));
function setSpeed(pct) {
  S.speed = pct / 100;
  send({ type: "speed", value: S.speed });
  updateUI();
}
$("speed").addEventListener("input", e => setSpeed(parseInt(e.target.value, 10)));
$("speedReset").addEventListener("click", () => { $("speed").value = 100; setSpeed(100); });

function setVolume(pct) {
  S.volume = pct / 100;
  if (S.gain) S.gain.gain.setTargetAtTime(S.volume, S.ctx.currentTime, 0.015);   // rampa breve: niente clic
  updateUI();
}
$("volume").addEventListener("input", e => setVolume(parseInt(e.target.value, 10)));

/* ----- tastiera ----- */
window.addEventListener("keydown", e => {
  if (e.code !== "Space" || !S.node) return;
  const t = e.target;
  if (t.tagName === "INPUT" && t.type === "text") return;
  e.preventDefault();
  if (t.tagName === "BUTTON") t.blur();
  togglePlay();
});

/* ----- interfaccia ----- */
function updateUI(fields) {
  setText($("playBtn"), S.playing ? "Pausa" : "Play");
  setText($("time"), fmt(S.pos) + " / " + fmt(S.T));
  if (!posDrag) posEl.value = S.pos.toFixed(2);
  setText($("semisLabel"), (S.semis > 0 ? "+" : "") + S.semis + (Math.abs(S.semis) === 1 ? " semitono" : " semitoni"));
  setText($("speedLabel"), Math.round(S.speed * 100) + "%");
  setText($("volumeLabel"), Math.round(S.volume * 100) + "%");
  if (S.node) { $("semisDown").disabled = S.semis <= -MAX_SEMIS; $("semisUp").disabled = S.semis >= MAX_SEMIS; }
  if (fields) {
    $("loopStart").value = fmt(S.ls); $("loopEnd").value = fmt(S.le); $("loopOn").checked = S.loopOn;
  }
}
</script>
</body>
</html>
